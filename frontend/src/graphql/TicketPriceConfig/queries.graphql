# Kept in sync with the schema, though the TicketPriceConfig page currently
# defines its own inline gql: codegen validates EVERY document together and
# refuses to emit anything if one is stale, so a drifted file here silently
# blocks regeneration for the whole app.
query GetTicketPriceConfigs {
  GetTicketPriceConfigs {
    config_id
    price
    label
    age_group
    key_image
    facilities {
      facility_id
      name
      code
    }
  }
}

mutation UpsertTicketPriceConfig(
  $price: Float!
  $facility_ids: [Float!]!
  $label: String
  $key_image: String
  $age_group: String
) {
  UpsertTicketPriceConfig(
    price: $price
    facility_ids: $facility_ids
    label: $label
    key_image: $key_image
    age_group: $age_group
  ) {
    config_id
    price
    label
    age_group
    key_image
    facilities {
      facility_id
      name
      code
    }
  }
}

mutation DeleteTicketPriceConfig($config_id: Float!) {
  DeleteTicketPriceConfig(config_id: $config_id)
}
